<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .register-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 350px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1976D2;
        }

        .success-message, .error-message {
            text-align: center;
            margin-top: 10px;
        }

        .success-message {
            color: green;
        }

        .error-message {
            color: red;
        }
    </style>
</head>
<body>
<div class="register-container">
    <h2>Регистрация</h2>
    <form id="registerForm">
        <input type="text" id="name" name="name" placeholder="Имя" required />
        <input type="text" id="lastname" name="lastname" placeholder="Фамилия" required />
        <input type="email" id="email" name="email" placeholder="Email" required />
        <input type="password" id="password" name="password" placeholder="Пароль" required />

        <!-- Поле для выбора роли -->
        <select id="role" name="role">
            <option value="">Выберите роль</option>
            <option value="USER">Пользователь</option>
            <option value="ADMIN">Администратор</option>
        </select>

        <button type="submit">Зарегистрироваться</button>

        <div class="success-message" id="successMessage"></div>
        <div class="error-message" id="errorMessage"></div>
    </form>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const lastname = document.getElementById('lastname').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const role = document.getElementById('role').value;

        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        // Простая клиентская валидация
        if (!name || !lastname || !email || !password || !role) {
            errorMessage.textContent = 'Все поля обязательны для заполнения.';
            return;
        }

        fetch('/api/users/registration', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ name, lastname, email, password, role })
        })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(data => {
                        throw new Error(data.message || 'Ошибка регистрации');
                    });
                }
                return response.json();
            })
            .then(data => {
                successMessage.textContent = 'Вы успешно зарегистрированы!';
                errorMessage.textContent = '';
                setTimeout(() => window.location.href = '/login', 1500);
            })
            .catch(error => {
                errorMessage.textContent = error.message;
                successMessage.textContent = '';
            });
    });
</script>
</body>
</html>
